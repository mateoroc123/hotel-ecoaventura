<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contrasena | Hotel EcoAventura</title>
    <link rel="stylesheet" href="Css/myStyle.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a5d1a 0%, #2e7d32 50%, #43a047 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
        }
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }
        h1 {
            color: #1a5d1a;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.6rem;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2e7d32;
        }
        .codigo-input {
            letter-spacing: 10px;
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background: #1a5d1a;
        }
        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn-back {
            background: #f5f5f5;
            color: #333;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-back:hover {
            background: #eee;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #2e7d32;
            text-decoration: none;
            font-size: 0.9rem;
            display: block;
            margin-bottom: 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .codigo-debug {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            display: none;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .icon-lock {
            text-align: center;
            margin-bottom: 20px;
        }
        .icon-lock i {
            font-size: 50px;
            color: #2e7d32;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="img/logo.png" alt="Hotel EcoAventura Logo">
        </div>
        
        <!-- Paso 1: Ingresar email -->
        <div id="step1" class="step active">
            <div class="icon-lock">
                <i class="fas fa-lock"></i>
            </div>
            <h1>Recuperar Contrasena</h1>
            <p class="subtitle">Ingresa tu correo electronico y te enviaremos un codigo de verificacion</p>
            
            <div id="error1" class="error-message"></div>
            
            <form id="form1">
                <div class="form-group">
                    <label for="email">Correo Electronico</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>
                <button type="submit" class="btn-submit" id="btn1">Enviar Codigo</button>
            </form>
            
            <div class="links">
                <a href="login.html">Volver al inicio de sesion</a>
                <a href="index.html">Ir a la pagina principal</a>
            </div>
        </div>
        
        <!-- Paso 2: Verificar codigo -->
        <div id="step2" class="step">
            <button class="btn-back" onclick="volverPaso1()">
                <i class="fas fa-arrow-left"></i> Volver
            </button>
            
            <div class="icon-lock">
                <i class="fas fa-envelope-open-text"></i>
            </div>
            <h1>Verificar Codigo</h1>
            <p class="subtitle">Ingresa el codigo de 6 digitos enviado a tu correo</p>
            
            <div id="error2" class="error-message"></div>
            <div id="codigoDebug" class="codigo-debug"></div>
            
            <form id="form2">
                <div class="form-group">
                    <label for="codigo">Codigo de Verificacion</label>
                    <input type="text" id="codigo" name="codigo" class="codigo-input" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required>
                </div>
                <button type="submit" class="btn-submit" id="btn2">Verificar Codigo</button>
            </form>
        </div>
        
        <!-- Paso 3: Nueva contrasena -->
        <div id="step3" class="step">
            <div class="icon-lock">
                <i class="fas fa-key"></i>
            </div>
            <h1>Nueva Contrasena</h1>
            <p class="subtitle">Crea tu nueva contrasena</p>
            
            <div id="error3" class="error-message"></div>
            <div id="success3" class="success-message"></div>
            
            <form id="form3">
                <div class="form-group">
                    <label for="nueva_password">Nueva Contrasena</label>
                    <input type="password" id="nueva_password" name="nueva_password" placeholder="Ingrese su nueva contrasena" required minlength="4">
                </div>
                <div class="form-group">
                    <label for="confirmar_password">Confirmar Contrasena</label>
                    <input type="password" id="confirmar_password" name="confirmar_password" placeholder="Repita su contrasena" required>
                </div>
                <button type="submit" class="btn-submit" id="btn3">Cambiar Contrasena</button>
            </form>
        </div>
    </div>
    
    <script>
        // Variables
        let emailRecuperacion = '';
        
        // Formulario 1: Solicitar codigo
        document.getElementById('form1').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const btn = document.getElementById('btn1');
            const errorDiv = document.getElementById('error1');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Enviando...';
            errorDiv.style.display = 'none';
            
            const formData = new FormData();
            formData.append('action', 'solicitar_codigo');
            formData.append('email', email);
            
            fetch('Php/recuperar_password.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = 'Enviar Codigo';
                
                if (data.success) {
                    emailRecuperacion = email;
                    
                    // Mostrar paso 2
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step2').classList.add('active');
                    
                    // Mostrar codigo debug (solo para pruebas)
                    if (data.codigo_debug) {
                        const debugDiv = document.getElementById('codigoDebug');
                        debugDiv.innerHTML = '<strong>Codigo de prueba:</strong> ' + data.codigo_debug + '<br><small>(En produccion se enviara por correo)</small>';
                        debugDiv.style.display = 'block';
                    }
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            })
            .catch(error => {
                btn.disabled = false;
                btn.innerHTML = 'Enviar Codigo';
                errorDiv.textContent = 'Error de conexion. Intenta de nuevo.';
                errorDiv.style.display = 'block';
            });
        });
        
        // Formulario 2: Verificar codigo
        document.getElementById('form2').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const codigo = document.getElementById('codigo').value;
            const btn = document.getElementById('btn2');
            const errorDiv = document.getElementById('error2');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Verificando...';
            errorDiv.style.display = 'none';
            
            const formData = new FormData();
            formData.append('action', 'verificar_codigo');
            formData.append('email', emailRecuperacion);
            formData.append('codigo', codigo);
            
            fetch('Php/recuperar_password.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = 'Verificar Codigo';
                
                if (data.success) {
                    // Mostrar paso 3
                    document.getElementById('step2').classList.remove('active');
                    document.getElementById('step3').classList.add('active');
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            })
            .catch(error => {
                btn.disabled = false;
                btn.innerHTML = 'Verificar Codigo';
                errorDiv.textContent = 'Error de conexion. Intenta de nuevo.';
                errorDiv.style.display = 'block';
            });
        });
        
        // Formulario 3: Cambiar contrasena
        document.getElementById('form3').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nuevaPassword = document.getElementById('nueva_password').value;
            const confirmarPassword = document.getElementById('confirmar_password').value;
            const btn = document.getElementById('btn3');
            const errorDiv = document.getElementById('error3');
            const successDiv = document.getElementById('success3');
            
            // Validar que coincidan
            if (nuevaPassword !== confirmarPassword) {
                errorDiv.textContent = 'Las contrasenas no coinciden';
                errorDiv.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Cambiando...';
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            const formData = new FormData();
            formData.append('action', 'cambiar_password');
            formData.append('nueva_password', nuevaPassword);
            formData.append('confirmar_password', confirmarPassword);
            
            fetch('Php/recuperar_password.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = 'Cambiar Contrasena';
                
                if (data.success) {
                    successDiv.textContent = 'Contrasena actualizada exitosamente. Redirigiendo...';
                    successDiv.style.display = 'block';
                    
                    // Redirigir al login
                    setTimeout(function() {
                        window.location.href = 'login.html?mensaje=contrasena_actualizada';
                    }, 2000);
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.style.display = 'block';
                }
            })
            .catch(error => {
                btn.disabled = false;
                btn.innerHTML = 'Cambiar Contrasena';
                errorDiv.textContent = 'Error de conexion. Intenta de nuevo.';
                errorDiv.style.display = 'block';
            });
        });
        
        // Volver al paso 1
        function volverPaso1() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
            document.getElementById('codigoDebug').style.display = 'none';
            document.getElementById('codigo').value = '';
        }
    </script>
</body>
</html>
